version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        # The project bans doc comments on exported identifiers and package
        # comments, so the two rules that demand them stay off.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: var-naming
        - name: indent-error-flow
        - name: unexported-return
        - name: context-as-argument
        - name: context-keys-type
        - name: receiver-naming
        - name: increment-decrement
        - name: range
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Flyrell/shortr/apps/api
