<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <title>shortr</title>
        <meta name="description" content="Long links in, short links out. Every link expires. Nothing to sign up for." />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="shortr" />
        <meta
            property="og:description"
            content="Long links in, short links out. Every link expires. Nothing to sign up for."
        />
        <meta property="og:url" content="__BASE_URL__/" />
        <meta property="og:image" content="__BASE_URL__/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="The shortr mark and wordmark: long links in, short links out." />
        <meta name="twitter:card" content="summary_large_image" />
        <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="stylesheet" href="/assets/styles.css" />
        <script type="module" src="/assets/main.js"></script>
    </head>
    <body>
        <div class="grid" aria-hidden="true"></div>

        <div class="stage">
            <header class="brand">
                <span class="wordmark">
                    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="10.05" y="16.45" width="31.1" height="31.1" rx="5" fill="currentColor" transform="rotate(45 25.6 32)" />
                        <rect x="22.85" y="16.45" width="31.1" height="31.1" rx="5" fill="var(--accent)" transform="rotate(45 38.4 32)" />
                    </svg>
                    <b>shortr</b>
                </span>
                <p class="tagline">
                    Long links in, short links out. Every link expires. Nothing to sign up for.
                </p>
            </header>

            <main class="panel">
                <div class="tabs" id="tabs" role="tablist" aria-label="Output type">
                    <button
                        class="tab ring"
                        type="button"
                        role="tab"
                        id="tab-shorten"
                        data-value="shorten"
                        aria-controls="panel"
                        aria-selected="true"
                        tabindex="0"
                    >
                        Shorten URL
                    </button>
                    <button
                        class="tab ring"
                        type="button"
                        role="tab"
                        id="tab-qr"
                        data-value="qr"
                        aria-controls="panel"
                        aria-selected="false"
                        tabindex="-1"
                    >
                        QR code
                    </button>
                </div>

                <form class="form" id="panel" role="tabpanel" aria-labelledby="tab-shorten" novalidate>
                    <div class="label-row">
                        <label for="url" id="url-label">URL to shorten</label>
                        <span class="micro" aria-hidden="true">01</span>
                    </div>
                    <div class="shell ring">
                        <input
                            id="url"
                            name="url"
                            type="url"
                            required
                            autofocus
                            autocomplete="off"
                            spellcheck="false"
                            inputmode="url"
                            placeholder="https://example.com/a/rather/long/path"
                            aria-describedby="url-hint"
                        />
                    </div>
                    <span class="hint" id="url-hint">Include the https:// prefix.</span>
                    <button class="submit ring" type="submit" id="submit">
                        <span id="submit-label">Shorten</span>
                    </button>
                </form>

                <p class="alert" id="error" role="alert" hidden></p>

                <div class="live" id="result" aria-live="polite"></div>
            </main>
        </div>

        <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </body>
</html>
