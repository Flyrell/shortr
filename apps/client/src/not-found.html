<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />
        <title>shortr · link not found</title>
        <meta name="description" content="This short link has expired or never existed." />
        <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="stylesheet" href="/assets/styles.css" />
    </head>
    <body>
        <div class="grid" aria-hidden="true"></div>

        <div class="stage">
            <header class="brand">
                <a class="wordmark" href="/">
                    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="10.05" y="16.45" width="31.1" height="31.1" rx="5" fill="currentColor" transform="rotate(45 25.6 32)" />
                        <rect x="22.85" y="16.45" width="31.1" height="31.1" rx="5" fill="var(--accent)" transform="rotate(45 38.4 32)" />
                    </svg>
                    <b>shortr</b>
                </a>
                <p class="tagline">
                    Long links in, short links out. Every link expires. Nothing to sign up for.
                </p>
            </header>

            <main class="panel notice">
                <div class="label-row">
                    <span class="notice-status">Link not found</span>
                    <span class="micro" aria-hidden="true">404</span>
                </div>
                <p class="notice-body">
                    This short link has expired or never existed. shortr links are temporary by
                    design, so old ones stop working once their time is up.
                </p>
                <a class="submit ring" href="/">Shorten a new link</a>
            </main>
        </div>
    </body>
</html>
