version: '3'

vars:
  NODE_IMAGE: node:24-alpine
  MODULES_VOLUME: shortr-client-modules
  NPM_CACHE_VOLUME: shortr-npm-cache
  # Derived from TASKFILE_DIR (not ROOT_DIR) so the mounts resolve the same way
  # whether this file runs standalone or as the "client" namespace included from
  # the root. The whole repository is mounted because biome.json extends the root
  # config. node_modules lives in a named volume so `npm ci` never wipes the host
  # tree and never leaves linux binaries in it.
  REPO_DIR: '{{dir (dir .TASKFILE_DIR)}}'
  DOCKER_RUN: >-
    docker run --rm
    -v {{.REPO_DIR}}:/repo
    -v {{.MODULES_VOLUME}}:/repo/apps/client/node_modules
    -v {{.NPM_CACHE_VOLUME}}:/root/.npm
    -w /repo/apps/client
    {{.NODE_IMAGE}}

tasks:
  lint:
    desc: Check formatting, lint rules and types of the client in Docker.
    cmds:
      - '{{.DOCKER_RUN}} sh -c "npm ci && npm run lint"'

  test:
    desc: Run the client unit tests in Docker.
    cmds:
      - '{{.DOCKER_RUN}} sh -c "npm ci && npm run test"'

  build:
    desc: Bundle the client into apps/client/dist in Docker.
    cmds:
      - '{{.DOCKER_RUN}} sh -c "npm ci && npm run build"'

  format:
    desc: Format the client sources in Docker.
    cmds:
      - '{{.DOCKER_RUN}} sh -c "npm ci && npm run format"'
