services:
  api:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: api-dev
    ports:
      - '8080:8080'
    # Every tunable variable comes from .env (copy .env.example); what stays below
    # is either fixed by the container layout or has to match the redis service.
    env_file:
      - path: .env
        required: false
    environment:
      STATIC_DIR: /app/apps/client/dist
      URL_PERSISTER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
    volumes:
      - ./apps/api:/app/apps/api
      - ./.docker/air.toml:/app/.docker/air.toml:ro
      - ./apps/client/dist:/app/apps/client/dist:ro
      - go-cache:/cache
    depends_on:
      redis:
        condition: service_healthy
      client:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries ::1 first and the server listens on IPv4 only.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  client:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: client-dev
    volumes:
      - ./apps/client:/app/apps/client
      # Keeps the image's linux-built dependencies from being shadowed by the bind mount above.
      - /app/apps/client/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'test -f /app/apps/client/dist/index.html']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-devpassword}']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-devpassword}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # External so `docker compose down --volumes` keeps the Go caches warm; the api
  # tasks share the same volume outside compose. `task project:start` and
  # `task api:start` create it; a bare `docker compose up` needs
  # `docker volume create shortr-go-cache` first.
  go-cache:
    external: true
    name: shortr-go-cache
  redis-data:
