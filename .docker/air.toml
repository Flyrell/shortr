root = "/app/apps/api"
tmp_dir = "/tmp"

[build]
  entrypoint = "/tmp/shortr"
  cmd = "go build -o /tmp/shortr ."
  delay = 500
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  # Restart the binary when it exits on its own, so a failed start recovers.
  rerun = true
  rerun_delay = 2000
  # Exercise the graceful shutdown path on every reload instead of killing.
  send_interrupt = true
  kill_delay = "2s"
