services:
  api:
    build: !override
      context: .
      dockerfile: .docker/Dockerfile
    # The e2e runner shares this container's network namespace, so nothing has to
    # be published and the port never collides with a development stack.
    ports: !reset null
    # Only the keys that differ from the development stack; the rest is inherited.
    environment:
      STATIC_DIR: /srv/client
      RATE_LIMIT_MODE: minute
      RATE_LIMIT_VALUE: 100
    volumes: !reset null
    depends_on: !override
      redis:
        condition: service_healthy
    # The production image is distroless: it holds no shell and no wget, so the
    # development healthcheck cannot run and the e2e runner waits on /healthz itself.
    healthcheck: !reset null

  e2e:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /tests
    volumes:
      - ./tests:/tests
      - e2e-modules:/tests/node_modules
    # Shares the API network namespace so the browser reaches the app on
    # http://localhost:8080, which the clipboard API requires as a secure context.
    network_mode: service:api
    depends_on:
      api:
        condition: service_started
    command:
      - sh
      - -c
      - |
        set -e
        curl -fsS --retry 60 --retry-delay 1 --retry-all-errors --retry-connrefused http://localhost:8080/healthz
        npm ci
        npm test

volumes:
  e2e-modules:
    external: true
    name: shortr-e2e-modules
